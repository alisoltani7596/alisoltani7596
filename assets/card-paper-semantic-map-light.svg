<svg xmlns="http://www.w3.org/2000/svg" width="580" height="210" viewBox="0 0 580 210" role="img" aria-label="paper-semantic-map"><title>paper-semantic-map</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><rect x="1" y="1" width="578" height="208" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="1" y="1" width="6" height="208" rx="3" fill="#6a3fb5"/><text x="30" y="38" font-size="12" font-weight="600" letter-spacing="1.8" fill="#656d76">CLAUDE SKILL</text><text x="552" y="40" font-size="20" text-anchor="end" fill="#656d76">&#8599;</text><text x="30" y="74" font-size="24" font-weight="700" fill="#1f2328">paper-semantic-map</text><text x="30" y="106" font-size="15.5" fill="#424a53">Turns papers into deep visual HTML maps and an</text><text x="30" y="128" font-size="15.5" fill="#424a53">archive that tracks gaps in a field against</text><text x="30" y="150" font-size="15.5" fill="#424a53">your own research question.</text><rect x="30" y="166" width="62" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/><text x="61" y="183.5" font-size="13" class="m" text-anchor="middle" fill="#424a53">Claude</text><rect x="99.8" y="166" width="76" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/><text x="138" y="183.5" font-size="13" class="m" text-anchor="middle" fill="#424a53">Research</text><rect x="184.2" y="166" width="47" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/><text x="208" y="183.5" font-size="13" class="m" text-anchor="middle" fill="#424a53">HTML</text></svg>