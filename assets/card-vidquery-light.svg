<svg xmlns="http://www.w3.org/2000/svg" width="580" height="210" viewBox="0 0 580 210" role="img" aria-label="vidquery"><title>vidquery</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><rect x="1" y="1" width="578" height="208" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="1" y="1" width="6" height="208" rx="3" fill="#0d7563"/><text x="30" y="38" font-size="12" font-weight="600" letter-spacing="1.8" fill="#656d76">DEPLOYMENT</text><text x="552" y="40" font-size="20" text-anchor="end" fill="#656d76">&#8599;</text><text x="30" y="74" font-size="24" font-weight="700" fill="#1f2328">vidquery</text><text x="30" y="106" font-size="15.5" fill="#424a53">Text-to-video person search with VLM verification.</text><text x="30" y="128" font-size="15.5" fill="#424a53">PyTorch, ONNX Runtime and TensorRT behind one</text><text x="30" y="150" font-size="15.5" fill="#424a53">interface, served with FastAPI, Docker and Slurm.</text><rect x="30" y="166" width="76" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/><text x="68" y="183.5" font-size="13" class="m" text-anchor="middle" fill="#424a53">TensorRT</text><rect x="114.4" y="166" width="69" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/><text x="149" y="183.5" font-size="13" class="m" text-anchor="middle" fill="#424a53">FastAPI</text><rect x="191.5" y="166" width="54" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/><text x="219" y="183.5" font-size="13" class="m" text-anchor="middle" fill="#424a53">FAISS</text><rect x="254.0" y="166" width="47" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/><text x="278" y="183.5" font-size="13" class="m" text-anchor="middle" fill="#424a53">vLLM</text></svg>