<svg xmlns="http://www.w3.org/2000/svg" width="580" height="210" viewBox="0 0 580 210" role="img" aria-label="TrapCounter / DTCFT"><title>TrapCounter / DTCFT</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><rect x="1" y="1" width="578" height="208" rx="12" fill="#161b22" stroke="#30363d"/><rect x="1" y="1" width="6" height="208" rx="3" fill="#f0925a"/><text x="30" y="38" font-size="12" font-weight="600" letter-spacing="1.8" fill="#8b949e">DATASET  ·  CRV 2025 ORAL</text><text x="552" y="40" font-size="20" text-anchor="end" fill="#8b949e">&#8599;</text><text x="30" y="74" font-size="24" font-weight="700" fill="#e6edf3">TrapCounter / DTCFT</text><text x="30" y="106" font-size="15.5" fill="#c9d1d9">First public dataset for detecting, tracking and</text><text x="30" y="128" font-size="15.5" fill="#c9d1d9">counting fishing traps in real vessel footage.</text><text x="30" y="150" font-size="15.5" fill="#c9d1d9">16,500 annotated frames from BC waters.</text><rect x="30" y="166" width="76" height="26" rx="13" fill="#0d1117" stroke="#30363d"/><text x="68" y="183.5" font-size="13" class="m" text-anchor="middle" fill="#c9d1d9">Tracking</text><rect x="114.4" y="166" width="106" height="26" rx="13" fill="#0d1117" stroke="#30363d"/><text x="167" y="183.5" font-size="13" class="m" text-anchor="middle" fill="#c9d1d9">Optical flow</text><rect x="228.0" y="166" width="62" height="26" rx="13" fill="#0d1117" stroke="#30363d"/><text x="259" y="183.5" font-size="13" class="m" text-anchor="middle" fill="#c9d1d9">Marine</text></svg>