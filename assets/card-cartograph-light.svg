<svg xmlns="http://www.w3.org/2000/svg" width="580" height="210" viewBox="0 0 580 210" role="img" aria-label="Cartograph"><title>Cartograph</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><rect x="1" y="1" width="578" height="208" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="1" y="1" width="6" height="208" rx="3" fill="#0d7563"/><text x="30" y="38" font-size="12" font-weight="600" letter-spacing="1.8" fill="#656d76">WEB APP  ·  RECEIPT PARSING</text><text x="552" y="40" font-size="20" text-anchor="end" fill="#656d76">&#8599;</text><text x="30" y="74" font-size="24" font-weight="700" fill="#1f2328">Cartograph</text><text x="30" y="106" font-size="15.5" fill="#424a53">Receipt photos and PDFs become a spending map.</text><text x="30" y="128" font-size="15.5" fill="#424a53">Claude or in-browser OCR, checked by reconciliation;</text><text x="30" y="150" font-size="15.5" fill="#424a53">100% item F1 on a held-out test set. No server.</text><rect x="30" y="166" width="91" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/><text x="76" y="183.5" font-size="13" class="m" text-anchor="middle" fill="#424a53">TypeScript</text><rect x="129.0" y="166" width="91" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/><text x="174" y="183.5" font-size="13" class="m" text-anchor="middle" fill="#424a53">Claude API</text><rect x="228.0" y="166" width="84" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/><text x="270" y="183.5" font-size="13" class="m" text-anchor="middle" fill="#424a53">Tesseract</text><rect x="319.7" y="166" width="91" height="26" rx="13" fill="#ffffff" stroke="#d0d7de"/><text x="365" y="183.5" font-size="13" class="m" text-anchor="middle" fill="#424a53">Eval in CI</text></svg>