<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Research areas"><title>Research areas</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><rect x="0" y="1" width="288" height="188" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><rect x="20" y="22" width="44" height="5" rx="2" fill="#0d7563"/><text x="268" y="30" font-size="13" class="m" text-anchor="end" fill="#656d76">01</text><text x="20" y="68" font-size="21" font-weight="650" fill="#1f2328">Spatio-temporal</text><text x="20" y="94" font-size="21" font-weight="650" fill="#1f2328">action detection</text><text x="20" y="128" font-size="15" fill="#424a53">Who does what, where and when,</text><text x="20" y="149" font-size="15" fill="#424a53">in long video.</text><rect x="304" y="1" width="288" height="188" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><rect x="324" y="22" width="44" height="5" rx="2" fill="#6a3fb5"/><text x="572" y="30" font-size="13" class="m" text-anchor="end" fill="#656d76">02</text><text x="324" y="68" font-size="21" font-weight="650" fill="#1f2328">Human review of</text><text x="324" y="94" font-size="21" font-weight="650" fill="#1f2328">detector errors</text><text x="324" y="128" font-size="15" fill="#424a53">Point a limited review budget</text><text x="324" y="149" font-size="15" fill="#424a53">at what the model missed.</text><rect x="608" y="1" width="288" height="188" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><rect x="628" y="22" width="44" height="5" rx="2" fill="#b04a17"/><text x="876" y="30" font-size="13" class="m" text-anchor="end" fill="#656d76">03</text><text x="628" y="68" font-size="21" font-weight="650" fill="#1f2328">Privacy-preserving</text><text x="628" y="94" font-size="21" font-weight="650" fill="#1f2328">video</text><text x="628" y="128" font-size="15" fill="#424a53">Mask people without breaking</text><text x="628" y="149" font-size="15" fill="#424a53">the task downstream.</text><rect x="912" y="1" width="288" height="188" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><rect x="932" y="22" width="44" height="5" rx="2" fill="#8c959f"/><text x="1180" y="30" font-size="13" class="m" text-anchor="end" fill="#656d76">04</text><text x="932" y="68" font-size="21" font-weight="650" fill="#1f2328">Robust vision</text><text x="932" y="94" font-size="21" font-weight="650" fill="#1f2328">at sea</text><text x="932" y="128" font-size="15" fill="#424a53">Spray, glare, occlusion and a</text><text x="932" y="149" font-size="15" fill="#424a53">moving deck.</text></svg>