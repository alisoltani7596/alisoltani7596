<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Research areas"><title>Research areas</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><rect x="0" y="1" width="288" height="188" rx="10" fill="#161b22" stroke="#30363d"/><rect x="20" y="22" width="44" height="5" rx="2" fill="#4fc9ad"/><text x="268" y="30" font-size="13" class="m" text-anchor="end" fill="#8b949e">01</text><text x="20" y="68" font-size="21" font-weight="650" fill="#e6edf3">Spatio-temporal</text><text x="20" y="94" font-size="21" font-weight="650" fill="#e6edf3">action detection</text><text x="20" y="128" font-size="15" fill="#c9d1d9">Who does what, where and when,</text><text x="20" y="149" font-size="15" fill="#c9d1d9">in long video.</text><rect x="304" y="1" width="288" height="188" rx="10" fill="#161b22" stroke="#30363d"/><rect x="324" y="22" width="44" height="5" rx="2" fill="#bb9ff2"/><text x="572" y="30" font-size="13" class="m" text-anchor="end" fill="#8b949e">02</text><text x="324" y="68" font-size="21" font-weight="650" fill="#e6edf3">Human review of</text><text x="324" y="94" font-size="21" font-weight="650" fill="#e6edf3">detector errors</text><text x="324" y="128" font-size="15" fill="#c9d1d9">Point a limited review budget</text><text x="324" y="149" font-size="15" fill="#c9d1d9">at what the model missed.</text><rect x="608" y="1" width="288" height="188" rx="10" fill="#161b22" stroke="#30363d"/><rect x="628" y="22" width="44" height="5" rx="2" fill="#f0925a"/><text x="876" y="30" font-size="13" class="m" text-anchor="end" fill="#8b949e">03</text><text x="628" y="68" font-size="21" font-weight="650" fill="#e6edf3">Privacy-preserving</text><text x="628" y="94" font-size="21" font-weight="650" fill="#e6edf3">video</text><text x="628" y="128" font-size="15" fill="#c9d1d9">Mask people without breaking</text><text x="628" y="149" font-size="15" fill="#c9d1d9">the task downstream.</text><rect x="912" y="1" width="288" height="188" rx="10" fill="#161b22" stroke="#30363d"/><rect x="932" y="22" width="44" height="5" rx="2" fill="#6e7681"/><text x="1180" y="30" font-size="13" class="m" text-anchor="end" fill="#8b949e">04</text><text x="932" y="68" font-size="21" font-weight="650" fill="#e6edf3">Robust vision</text><text x="932" y="94" font-size="21" font-weight="650" fill="#e6edf3">at sea</text><text x="932" y="128" font-size="15" fill="#c9d1d9">Spray, glare, occlusion and a</text><text x="932" y="149" font-size="15" fill="#c9d1d9">moving deck.</text></svg>