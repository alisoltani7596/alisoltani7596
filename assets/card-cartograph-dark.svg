<svg xmlns="http://www.w3.org/2000/svg" width="580" height="210" viewBox="0 0 580 210" role="img" aria-label="Cartograph"><title>Cartograph</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><rect x="1" y="1" width="578" height="208" rx="12" fill="#161b22" stroke="#30363d"/><rect x="1" y="1" width="6" height="208" rx="3" fill="#4fc9ad"/><text x="30" y="38" font-size="12" font-weight="600" letter-spacing="1.8" fill="#8b949e">SIDE PROJECT  ·  WEB APP</text><text x="552" y="40" font-size="20" text-anchor="end" fill="#8b949e">&#8599;</text><text x="30" y="74" font-size="24" font-weight="700" fill="#e6edf3">Cartograph</text><text x="30" y="106" font-size="15.5" fill="#c9d1d9">Receipt photos and PDFs become a spending map.</text><text x="30" y="128" font-size="15.5" fill="#c9d1d9">Claude or in-browser OCR, checked by reconciliation;</text><text x="30" y="150" font-size="15.5" fill="#c9d1d9">100% item F1 on a held-out test set. No server.</text><rect x="30" y="166" width="91" height="26" rx="13" fill="#0d1117" stroke="#30363d"/><text x="76" y="183.5" font-size="13" class="m" text-anchor="middle" fill="#c9d1d9">TypeScript</text><rect x="129.0" y="166" width="91" height="26" rx="13" fill="#0d1117" stroke="#30363d"/><text x="174" y="183.5" font-size="13" class="m" text-anchor="middle" fill="#c9d1d9">Claude API</text><rect x="228.0" y="166" width="84" height="26" rx="13" fill="#0d1117" stroke="#30363d"/><text x="270" y="183.5" font-size="13" class="m" text-anchor="middle" fill="#c9d1d9">Tesseract</text><rect x="319.7" y="166" width="91" height="26" rx="13" fill="#0d1117" stroke="#30363d"/><text x="365" y="183.5" font-size="13" class="m" text-anchor="middle" fill="#c9d1d9">Eval in CI</text></svg>